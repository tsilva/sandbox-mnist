[project]
name = "sandbox-mnist"
version = "0.1.0"
description = "Build MNIST datasets and noisy Gaussian variants for Hugging Face."
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.4.1",
  "huggingface_hub>=0.31.0",
  "modal>=1.1.0",
  "numpy>=2.2.4",
  "pillow>=12.3.0",
  "torch>=2.13.0",
  "torchvision>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.14.0",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
  "aiohttp>=3.14.3",
  "h2>=4.4.1",
  "idna>=3.15",
  "pygments>=2.20",
  "requests>=2.33.0",
  "setuptools>=83.0.0",
  "urllib3>=2.7.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
